name: rusttest

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]

    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{ matrix.rust }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests stable
        if: matrix.rust == 'stable'
        run: cargo test --verbose
      # Heavy Monte-Carlo tier.  The sample size and the Euler resolution of the MC checks in
      # `src/rates/tests.rs` are tiered on the `slow` feature (see `src/mc.rs`), so plain
      # `cargo test` above stays a few seconds while this step runs the tight end of the same
      # error-budget curve: ~20x the antithetic pairs on a 4x finer grid, which tightens the
      # `k * SE + discretisation residual` bands from ~1e-4 to a few times 1e-5.  `--nocapture` so the
      # per-run budget reports land in the log.  The nightly coverage run below uses
      # `--all-features`, which pulls in `slow` as well, so the heavy tier is exercised twice.
      - name: Run heavy Monte-Carlo tests (slow feature)
        if: matrix.rust == 'stable'
        run: cargo test --verbose --features slow -- --nocapture
      - name: Install cargo-llvm-cov
        if: matrix.rust == 'nightly'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests nightly with coverage
        if: matrix.rust == 'nightly'
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cat lcov.info

      - name: Document
        run: cargo doc
      - name: Coveralls
        if: matrix.rust == 'nightly'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "lcov.info"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly

      - name: benchmark
        run: cargo bench --features test-support | tee output.txt

      - name: Download previous benchmark data
        uses: actions/cache@v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: "cargo"
          # Where the output from the benchmark tool is stored
          output-file-path: output.txt
          # Where the previous data file is stored
          external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: "200%"
