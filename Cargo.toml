[package]
name = "hull_white"
version = "0.9.0"
authors = ["Daniel Stahl <danstahl1138@gmail.com>"]
homepage = "https://github.com/danielhstahl/hull_white_rust"
repository = "https://github.com/danielhstahl/hull_white_rust"
readme = "README.md"
license = "MIT"
description = "Pricing functions assuming a Hull White short rate"
edition = "2024"
# Minimum supported Rust version.  It is the edition floor, not a claim about the code: nothing here
# needs a newer compiler than the one `edition = "2024"` requires, and CI builds on `stable` and
# `nightly` (see .github/workflows/test.yml).  Raise this only when something in the crate actually
# starts requiring more, and say so in CHANGELOG.md.
rust-version = "1.85"
# crates.io taxonomy.  `categories` are the display names from <https://crates.io/categories> (a
# wrong id is rejected at publish time, not at `cargo build`), and `keywords` are the free-text
# search terms people actually type — "hull-white" is the name of the model and the main reason a
# stranger lands on this crate.
keywords = ["hull-white", "interest-rates", "finance", "options", "pricing"]
categories = ["finance", "mathematics", "science"]
# The model documentation under `documentation/` is R Sweave / LaTeX source and its rendered PDF.
# It is 188 KiB — most of the shipped tarball — and nothing on the Rust side reads it: API docs
# come from `cargo doc`/docs.rs and the model write-up is read on GitHub.  Keeping it out of the
# published crate buys that back with no cost to consumers; the README still points at the
# directory in the repository.
exclude = [
  "documentation/*.pdf",
  "documentation/*.tex",
  "documentation/*.rnw",
  "documentation/*.aux",
  "documentation/*.log",
]

[features]
# Heavy Monte-Carlo tests (`src/mc.rs` and the MC checks in `src/rates/tests.rs`).
#
# Off by default so plain `cargo test` stays a fraction of a second on the Monte-Carlo path: the
# sample size and the Euler resolution come from `mc::scale()`, which is tiered on this feature.
# With it on, each check runs ~20x the antithetic pairs on a 4x finer grid, which tightens the
# `k * standard_error + discretisation residual` band from ~1e-4 to a few times 1e-5 and moves
# the discretisation residual from "noise-dominated bound" to "measured".  CI runs both tiers
# (see .github/workflows/test.yml); `--all-features` under coverage gets the heavy one for free.
#
#     cargo test                       # quick tier
#     cargo test --features slow        # heavy tier
#     cargo test --features slow -- --nocapture   # per-run error-budget report on stdout
slow = []

# Shared, internally-consistent curve fixtures (`hull_white::test_support`).
#
# Off by default and `#[doc(hidden)]`: this is not part of the crate's public surface.  Unit tests
# get the module through `cfg(test)`; `benches/` is a separate crate and cannot see `cfg(test)`, so
# the bench command turns this on explicitly -- `cargo bench --features test-support` (cargo does
# not infer it).  That is the exact command the bench jobs run, in
# .github/workflows/benchmark_ghpages.yml and the `bench` job of .github/workflows/test.yml,
# under nightly because the benches are libtest `#[bench]` functions (`#![feature(test)]`).
# It builds the benches off the same fixture the tests use instead of a copy of it.
test-support = []

[dependencies]
black_scholes = "0.11.1"
binomial_tree = "0.5.0"

[dev-dependencies]
approx = "0.5.1"
# `rand` alone gives the RNGs; the normal draws come from `rand_distr` (see `src/mc.rs`).
rand = "0.9"
rand_distr = "0.5"
# A/B harness (`src/solver_ab.rs`) still needs the solver this crate replaced.
nrfind = "1.0.3"

# Every `pub` item reachable from the crate root has to carry a doc comment, at compile time rather
# than in review.  `pub(crate)` items are exempt (they are not the API), which is why the kernel
# functions and the module plumbing stay quiet while `HullWhite`'s methods may not.
#
# Declared here rather than as a `#![deny(missing_docs)]` in `src/lib.rs` so the policy covers every
# target cargo builds through this manifest — lib, doctests, benches — instead of only the one
# file that happens to carry the attribute.
[lints.rust]
missing_docs = "deny"

[profile.bench]
lto = true
